<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Sky Portal{% endblock %}</title>

    <style>

       /* page background */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7fb;
        }

        /* top navigation area */
        nav {
            background: #1e1e2f;
            padding: 20px;
            text-align: center;
        }

        /* sky portal text */
        nav h1 {
            margin: 0;
            color: white;
        }

        /* logo image above title */
        nav h1::before {
            content: "";
            display: block;
            width: 130px;
            height: 55px;
            margin: 0 auto 8px auto;
            background-image: url("/static/images/Logo.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* remove line */
        hr {
            display: none;
        }

        /* login and signup heading */
        h2 {
            color: #1e1e2f;
            font-size: 30px;
            margin-top: 50px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* login and signup form container */
        form {
            max-width: 480px;
            margin: 20px auto 15px auto;
            padding: 32px;
            background: white;
            border: 2px solid #1e1e2f;
            border-radius: 26px;
        }

        /* form labels */
        form p {
            font-weight: bold;
            color: #1e1e2f;
        }

        /* input fields */
        form input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cfcfdd;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 5px;
        }

        /* login and signup button */
        button {
            background: #1e1e2f;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* button hover */
        button:hover {
            background: #33334d;
        }

        /* bottom text */
        p {
            text-align: center;
        }

        /* links */
        a {
            color: #1e1e2f;
            font-weight: bold;
        }
</style>

</head>
<body>
    <nav>
        <h1>Sky Portal</h1>
    </nav>

    <hr>
        {% block content %}
        {% endblock %}
