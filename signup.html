<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Create Account</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="form-page">

<div class="form-container">

<div class="form-logo">
<img src="logo.png" alt="Sky Engineering Portal Logo">
<h1>Sky Engineering Portal</h1>
</div>

<p class="subtitle">Create an account</p>

<form action="login.html">

<div class="row">

<div class="field">
<label for="fname">First Name</label>
<input id="fname" type="text">
</div>

<div class="field">
<label for="surname">Surname</label>
<input id="surname" type="text">
</div>

</div>

<div class="row">

<div class="field">
<label for="email2">Email Address</label>
<input id="email2" type="email">
</div>

<div class="field">
<label for="username">Username</label>
<input id="username" type="text">
</div>

</div>

<div class="row">

<div class="field">
<label for="pass1">Password</label>
<input id="pass1" type="password">
</div>

<div class="field">
<label for="pass2">Confirm Password</label>
<input id="pass2" type="password">
</div>

</div>

<label>
<input type="checkbox"> I agree to the terms of service
</label>

<button type="submit">Create account</button>

</form>

<div class="form-link">
<a href="login.html">Already have an account? Sign in</a>
</div>

</div>

</main>

</body>
</html>
